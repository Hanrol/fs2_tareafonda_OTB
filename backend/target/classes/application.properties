spring.application.name=fonda-san-belarmino-api

# --- Perfil por defecto: base de datos en memoria -------------------------
# Permite levantar el proyecto sin instalar nada. Los datos se pierden al
# detener la aplicacion, asi que sirve para desarrollar, no para la entrega.
spring.datasource.url=jdbc:h2:mem:fonda;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# Maximo de unidades por cliente para bebidas alcoholicas.
# Declarado aqui una sola vez: no repitas este numero en el codigo.
fonda.limite-unidades-por-cliente=3

# Origen del frontend autorizado para consumir la API (CORS).
# El servidor de desarrollo de Vite usa el puerto 5173.
fonda.cors.origen=http://localhost:5173
