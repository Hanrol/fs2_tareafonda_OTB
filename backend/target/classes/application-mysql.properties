# --- Perfil 'mysql': base de datos real -----------------------------------
# Se activa con:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#
# Crea antes el esquema:  CREATE DATABASE fonda CHARACTER SET utf8mb4;
#
# No escribas credenciales reales en este archivo si el repositorio es
# publico. Usa variables de entorno, como esta abajo.

spring.datasource.url=jdbc:mysql://localhost:3306/fonda?serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=always
